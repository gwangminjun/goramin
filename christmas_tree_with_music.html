<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>크리스마스 트리 - 눈 내리는 밤</title>
    <link rel="stylesheet" href="assets/css/christmas_tree.css">
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    
    <audio id="bgMusic"></audio>
    
    <!-- 재생목록 패널 -->
    <div class="playlist-panel" id="playlistPanel">
        <div class="playlist-header">
            <div class="playlist-title">
                <button class="playlist-toggle" id="playlistToggle">🎄</button>
                <span>🎵 재생목록</span>
            </div>
            <button class="clear-btn" id="clearPlaylist">초기화</button>
        </div>
        
        <div class="add-song-form">
            <div class="file-input-wrapper">
                <label for="songFileInput" class="file-input-label" id="fileLabel">
                    📁 MP3 파일 선택
                </label>
                <input type="file" 
                       id="songFileInput" 
                       accept="audio/mp3,audio/mpeg,audio/m4a,audio/*">
            </div>
            <input type="text" 
                   class="song-input" 
                   id="songNameInput" 
                   placeholder="노래 제목 (선택사항)">
            <button class="add-btn" id="addSongBtn">추가하기</button>
        </div>
        
        <div class="playlist-count" id="playlistCount">0 / 5</div>
        
        <div class="playlist-items" id="playlistItems">
            <div class="empty-playlist">재생목록이 비어있습니다</div>
        </div>
    </div>

    <!-- 메시지 편집 패널 -->
    <div class="message-panel" id="messagePanel">
        <div class="message-header">
            <div class="message-title">
                <span>✏️ 메시지 편집</span>
            </div>
            <button class="message-toggle" id="messageToggle">🎄</button>
        </div>
        
        <div class="message-editor-form">
            <div class="message-label">화면 메시지</div>
            <textarea class="message-textarea" 
                      id="messageInput" 
                      placeholder="화면에 표시할 메시지를 입력하세요...">핸진 민준 
하는일 다 잘되게 해주세요</textarea>
            
            <div class="message-buttons">
                <button class="save-message-btn" id="saveMessageBtn">저장</button>
                <button class="reset-message-btn" id="resetMessageBtn">초기화</button>
            </div>
            
            <div class="message-label" style="margin-top: 15px;">미리보기</div>
            <div class="message-preview" id="messagePreview">하는일 다 잘되게 해주세요</div>
        </div>
    </div>
    
    <div class="container">
        <div class="message" id="displayMessage">하는일 다 잘되게 해주세요</div>
        
        <div class="tree">
            <div class="star"></div>
            <div class="tree-section"></div>
            <div class="tree-section"></div>
            <div class="tree-section"></div>
            <div class="tree-section"></div>
            <div class="trunk"></div>
            
            <div class="light light-red"></div>
            <div class="light light-blue"></div>
            <div class="light light-yellow"></div>
            <div class="light light-green"></div>
            <div class="light light-pink"></div>
            <div class="light light-orange"></div>
        </div>
    </div>

    <div class="music-control">
        <div class="volume-control">
            <button class="volume-btn" id="volumeBtn">
                <svg viewBox="0 0 24 24" id="volumeIcon">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
            <input type="range" 
                   class="volume-slider" 
                   id="volumeSlider" 
                   min="0" 
                   max="100" 
                   value="70">
            <span class="volume-percentage" id="volumePercentage">70%</span>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar-wrapper" id="progressWrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>
        
        <div class="music-buttons">
            <div class="next-prev-btns">
                <button class="nav-btn" id="prevBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="music-btn" id="playBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button class="music-btn hidden" id="pauseBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                    </svg>
                </button>
                <button class="nav-btn" id="nextBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>
            <div class="music-title" id="currentSongTitle">🎵 재생목록에서 선택하세요</div>
        </div>
    </div>

    <script>
        // 눈 내리는 애니메이션
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Snowflake {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 3 + 2;
                this.speed = Math.random() * 1 + 0.5;
                this.wind = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.y += this.speed;
                this.x += this.wind;

                if (this.y > canvas.height) {
                    this.reset();
                    this.y = 0;
                }

                if (this.x > canvas.width) {
                    this.x = 0;
                } else if (this.x < 0) {
                    this.x = canvas.width;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        const snowflakes = [];
        const snowflakeCount = 150;

        for (let i = 0; i < snowflakeCount; i++) {
            snowflakes.push(new Snowflake());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snowflakes.forEach(snowflake => {
                snowflake.update();
                snowflake.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // 음악 컨트롤
        const music = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const progressBar = document.getElementById('progressBar');
        const progressWrapper = document.getElementById('progressWrapper');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentSongTitle = document.getElementById('currentSongTitle');
        
        // 음량 컨트롤
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumePercentage = document.getElementById('volumePercentage');
        let isMuted = false;
        let lastVolume = 70;

        // 재생목록 관리
        const songFileInput = document.getElementById('songFileInput');
        const fileLabel = document.getElementById('fileLabel');
        const songNameInput = document.getElementById('songNameInput');
        const addSongBtn = document.getElementById('addSongBtn');
        const clearPlaylistBtn = document.getElementById('clearPlaylist');
        const playlistItems = document.getElementById('playlistItems');
        const playlistCount = document.getElementById('playlistCount');
        const playlistPanel = document.getElementById('playlistPanel');
        const playlistToggle = document.getElementById('playlistToggle');

        // 메시지 편집 관리
        const messagePanel = document.getElementById('messagePanel');
        const messageToggle = document.getElementById('messageToggle');
        const messageInput = document.getElementById('messageInput');
        const saveMessageBtn = document.getElementById('saveMessageBtn');
        const resetMessageBtn = document.getElementById('resetMessageBtn');
        const messagePreview = document.getElementById('messagePreview');
        const displayMessage = document.getElementById('displayMessage');

        let playlist = [];
        let currentSongIndex = -1;
        let selectedFile = null;
        const MAX_PLAYLIST_SIZE = 5;
        const DB_NAME = 'ChristmasMusicDB';
        const STORE_NAME = 'songs';
        let db;
        const DEFAULT_MESSAGE = '핸진 민준 \n하는일 다 잘되게 해주세요';

        // 재생목록 토글
        playlistToggle.addEventListener('click', () => {
            playlistPanel.classList.toggle('collapsed');
        });

        // 메시지 패널 토글
        messageToggle.addEventListener('click', () => {
            messagePanel.classList.toggle('collapsed');
        });

        // 메시지 입력 시 미리보기 업데이트
        messageInput.addEventListener('input', () => {
            messagePreview.textContent = messageInput.value || '메시지를 입력하세요...';
        });

        // 메시지 저장
        saveMessageBtn.addEventListener('click', () => {
            const message = messageInput.value.trim();
            if (!message) {
                alert('메시지를 입력해주세요.');
                return;
            }
            
            displayMessage.innerHTML = message.replace(/\n/g, '<br>');
            localStorage.setItem('christmasMessage', message);
            alert('메시지가 저장되었습니다!');
        });

        // 메시지 초기화
        resetMessageBtn.addEventListener('click', () => {
            if (confirm('메시지를 초기화하시겠습니까?')) {
                messageInput.value = DEFAULT_MESSAGE;
                messagePreview.textContent = DEFAULT_MESSAGE;
                displayMessage.innerHTML = DEFAULT_MESSAGE.replace(/\n/g, '<br>');
                localStorage.setItem('christmasMessage', DEFAULT_MESSAGE);
            }
        });

        // 저장된 메시지 불러오기
        function loadMessage() {
            const savedMessage = localStorage.getItem('christmasMessage');
            if (savedMessage) {
                messageInput.value = savedMessage;
                messagePreview.textContent = savedMessage;
                displayMessage.innerHTML = savedMessage.replace(/\n/g, '<br>');
            }
        }

        // 하트 클릭 이펙트
        document.addEventListener('click', (e) => {
            // 버튼이나 입력 요소 클릭은 제외
            if (e.target.tagName === 'BUTTON' || 
                e.target.tagName === 'INPUT' || 
                e.target.tagName === 'LABEL' ||
                e.target.closest('button') ||
                e.target.closest('input') ||
                e.target.closest('label')) {
                return;
            }

            createHeart(e.clientX, e.clientY);
        });

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '❤️';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            
            // 랜덤한 각도로 살짝 퍼지게
            const randomX = (Math.random() - 0.5) * 40;
            heart.style.setProperty('--randomX', randomX + 'px');
            
            document.body.appendChild(heart);
            
            // 애니메이션 끝나면 제거
            setTimeout(() => {
                heart.remove();
            }, 2000);
        }

        // IndexedDB 초기화
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        // 파일을 IndexedDB에 저장
        function saveFileToIndexedDB(file, name) {
            return new Promise((resolve, reject) => {
                // 먼저 파일을 읽기
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    // 파일 읽기 완료 후 트랜잭션 시작
                    try {
                        const transaction = db.transaction([STORE_NAME], 'readwrite');
                        const store = transaction.objectStore(STORE_NAME);
                        
                        const request = store.add({
                            name: name,
                            file: e.target.result,
                            type: file.type
                        });
                        
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = () => reject(request.error);
                    } catch (error) {
                        reject(error);
                    }
                };
                
                reader.onerror = () => reject(reader.error);
                reader.readAsArrayBuffer(file);
            });
        }

        // IndexedDB에서 모든 곡 불러오기
        function loadAllSongsFromIndexedDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // IndexedDB에서 특정 곡 불러오기
        function getSongFromIndexedDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(id);
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // IndexedDB에서 곡 삭제
        function deleteSongFromIndexedDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // IndexedDB 전체 삭제
        function clearIndexedDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.clear();
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // 재생목록 불러오기
        async function loadPlaylist() {
            try {
                const songs = await loadAllSongsFromIndexedDB();
                playlist = songs;
                renderPlaylist();
            } catch (error) {
                console.error('재생목록 로드 실패:', error);
            }
        }

        // 재생목록 렌더링
        function renderPlaylist() {
            playlistCount.textContent = `${playlist.length} / ${MAX_PLAYLIST_SIZE}`;
            
            if (playlist.length === 0) {
                playlistItems.innerHTML = '<div class="empty-playlist">재생목록이 비어있습니다</div>';
                return;
            }

            playlistItems.innerHTML = playlist.map((song, index) => `
                <div class="playlist-item ${index === currentSongIndex ? 'active' : ''}" 
                     data-index="${index}">
                    <div class="song-info">
                        <span class="song-number">${index + 1}.</span>
                        ${song.name}
                    </div>
                    <button class="delete-song-btn" data-index="${index}">×</button>
                </div>
            `).join('');

            // 이벤트 리스너 추가
            document.querySelectorAll('.playlist-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('delete-song-btn')) {
                        const index = parseInt(item.dataset.index);
                        playSong(index);
                    }
                });
            });

            document.querySelectorAll('.delete-song-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const index = parseInt(btn.dataset.index);
                    await deleteSong(index);
                });
            });

            // 추가 버튼 활성화/비활성화
            addSongBtn.disabled = playlist.length >= MAX_PLAYLIST_SIZE;
        }

        // 파일 선택 이벤트
        songFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                // 파일 확장자 검증
                const fileName = file.name.toLowerCase();
                const validExtensions = ['.mp3', '.mpeg', '.m4a'];
                const isValidFile = validExtensions.some(ext => fileName.endsWith(ext));
                
                if (!isValidFile) {
                    alert('MP3, MPEG, M4A 파일만 지원됩니다.');
                    songFileInput.value = '';
                    return;
                }
                
                selectedFile = file;
                fileLabel.textContent = `✓ ${file.name}`;
                fileLabel.classList.add('has-file');
                
                // 제목이 비어있으면 파일명으로 자동 설정
                if (!songNameInput.value) {
                    songNameInput.value = file.name.replace(/\.[^/.]+$/, '');
                }
            }
        });

        // 노래 추가
        addSongBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                alert('MP3 파일을 선택해주세요.');
                return;
            }

            if (playlist.length >= MAX_PLAYLIST_SIZE) {
                alert('재생목록은 최대 5개까지 추가할 수 있습니다.');
                return;
            }

            const name = songNameInput.value.trim() || selectedFile.name.replace(/\.[^/.]+$/, '');

            try {
                await saveFileToIndexedDB(selectedFile, name);
                await loadPlaylist();
                
                // 입력 필드 초기화
                songFileInput.value = '';
                songNameInput.value = '';
                fileLabel.textContent = '📁 MP3 파일 선택';
                fileLabel.classList.remove('has-file');
                selectedFile = null;
                
                alert('노래가 추가되었습니다!');
            } catch (error) {
                console.error('노래 추가 실패:', error);
                alert('노래 추가에 실패했습니다.');
            }
        });

        // 노래 삭제
        async function deleteSong(index) {
            if (confirm('이 노래를 삭제하시겠습니까?')) {
                try {
                    const song = playlist[index];
                    await deleteSongFromIndexedDB(song.id);
                    
                    // 현재 재생 중인 노래가 삭제된 경우
                    if (index === currentSongIndex) {
                        music.pause();
                        music.src = '';
                        currentSongIndex = -1;
                        playBtn.classList.remove('hidden');
                        pauseBtn.classList.add('hidden');
                        currentSongTitle.textContent = '🎵 재생목록에서 선택하세요';
                    } else if (index < currentSongIndex) {
                        currentSongIndex--;
                    }

                    await loadPlaylist();
                } catch (error) {
                    console.error('노래 삭제 실패:', error);
                    alert('노래 삭제에 실패했습니다.');
                }
            }
        }

        // 재생목록 초기화
        clearPlaylistBtn.addEventListener('click', async () => {
            if (confirm('재생목록을 모두 삭제하시겠습니까?')) {
                try {
                    await clearIndexedDB();
                    playlist = [];
                    currentSongIndex = -1;
                    music.pause();
                    music.src = '';
                    playBtn.classList.remove('hidden');
                    pauseBtn.classList.add('hidden');
                    currentSongTitle.textContent = '🎵 재생목록에서 선택하세요';
                    renderPlaylist();
                    alert('재생목록이 초기화되었습니다.');
                } catch (error) {
                    console.error('초기화 실패:', error);
                    alert('초기화에 실패했습니다.');
                }
            }
        });

        // 노래 재생
        async function playSong(index) {
            if (index < 0 || index >= playlist.length) return;

            try {
                currentSongIndex = index;
                const song = playlist[index];
                
                // IndexedDB에서 파일 데이터 가져오기
                const songData = await getSongFromIndexedDB(song.id);
                
                // MIME 타입 확인 및 수정
                let mimeType = songData.type || 'audio/mpeg';
                if (!mimeType.startsWith('audio/')) {
                    mimeType = 'audio/mpeg';
                }
                
                const blob = new Blob([songData.file], { type: mimeType });
                const url = URL.createObjectURL(blob);
                
                // 이전 URL 해제
                if (music.src && music.src.startsWith('blob:')) {
                    URL.revokeObjectURL(music.src);
                }
                
                music.src = url;
                music.load();
                
                // 재생 시도
                try {
                    await music.play();
                    currentSongTitle.textContent = `🎵 ${song.name}`;
                    playBtn.classList.add('hidden');
                    pauseBtn.classList.remove('hidden');
                } catch (playError) {
                    console.error('재생 오류:', playError);
                    throw new Error('이 파일은 재생할 수 없습니다. MP3 파일인지 확인해주세요.');
                }
                
                renderPlaylist();
            } catch (error) {
                console.error('재생 실패:', error);
                alert(error.message || '재생에 실패했습니다.');
                
                // 재생 실패 시 UI 복구
                playBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
            }
        }

        // 이전 곡
        prevBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            
            let newIndex = currentSongIndex - 1;
            if (newIndex < 0) newIndex = playlist.length - 1;
            playSong(newIndex);
        });

        // 다음 곡
        nextBtn.addEventListener('click', () => {
            if (playlist.length === 0) return;
            
            let newIndex = currentSongIndex + 1;
            if (newIndex >= playlist.length) newIndex = 0;
            playSong(newIndex);
        });

        // 곡 종료 시 다음 곡 자동 재생
        music.addEventListener('ended', () => {
            if (playlist.length > 0) {
                let newIndex = currentSongIndex + 1;
                if (newIndex >= playlist.length) newIndex = 0;
                playSong(newIndex);
            }
        });

        // 시간 포맷 함수 (초 -> 분:초)
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 재생 버튼
        playBtn.addEventListener('click', () => {
            if (currentSongIndex === -1 && playlist.length > 0) {
                playSong(0);
            } else if (music.src) {
                music.play();
                playBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
            }
        });

        // 일시정지 버튼
        pauseBtn.addEventListener('click', () => {
            music.pause();
            pauseBtn.classList.add('hidden');
            playBtn.classList.remove('hidden');
        });

        // 음악 메타데이터 로드 시 전체 시간 표시
        music.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(music.duration);
        });

        // 재생 시간 업데이트
        music.addEventListener('timeupdate', () => {
            if (music.duration) {
                const progress = (music.currentTime / music.duration) * 100;
                progressBar.style.width = progress + '%';
                currentTimeEl.textContent = formatTime(music.currentTime);
            }
        });

        // 진행바 클릭으로 위치 이동
        progressWrapper.addEventListener('click', (e) => {
            if (music.duration) {
                const rect = progressWrapper.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percentage = clickX / rect.width;
                music.currentTime = percentage * music.duration;
            }
        });

        // 음량 아이콘 업데이트
        function updateVolumeIcon(volume) {
            if (volume === 0) {
                volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            } else if (volume < 50) {
                volumeIcon.innerHTML = '<path d="M7 9v6h4l5 5V4l-5 5H7z"/>';
            } else {
                volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            }
        }

        // 음량 슬라이더 이벤트
        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value;
            music.volume = volume / 100;
            volumePercentage.textContent = volume + '%';
            updateVolumeIcon(parseInt(volume));
            
            if (volume > 0 && isMuted) {
                isMuted = false;
            }
            
            // 음량 저장
            localStorage.setItem('musicVolume', volume);
        });

        // 음소거 토글
        volumeBtn.addEventListener('click', () => {
            if (isMuted) {
                // 음소거 해제
                music.volume = lastVolume / 100;
                volumeSlider.value = lastVolume;
                volumePercentage.textContent = lastVolume + '%';
                updateVolumeIcon(lastVolume);
                isMuted = false;
            } else {
                // 음소거
                lastVolume = volumeSlider.value;
                music.volume = 0;
                volumeSlider.value = 0;
                volumePercentage.textContent = '0%';
                updateVolumeIcon(0);
                isMuted = true;
            }
        });

        // 저장된 음량 불러오기
        function loadVolume() {
            const savedVolume = localStorage.getItem('musicVolume');
            if (savedVolume) {
                const volume = parseInt(savedVolume);
                music.volume = volume / 100;
                volumeSlider.value = volume;
                volumePercentage.textContent = volume + '%';
                updateVolumeIcon(volume);
            } else {
                music.volume = 0.7; // 기본 70%
            }
        }

        // 초기화
        initDB().then(() => {
            loadPlaylist();
            loadVolume(); // 저장된 음량 불러오기
            loadMessage(); // 저장된 메시지 불러오기
        }).catch(error => {
            console.error('DB 초기화 실패:', error);
            alert('데이터베이스 초기화에 실패했습니다.');
        });
    </script>
</body>
</html>
